<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skolelinux · Debian Edu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16181d; --ink-2:#4a4f5a; --ink-3:#7a808c;
  --paper:#faf8f4; --paper-2:#f2eee6; --line:#e2ddd2;
  --red:#c8063f; --red-2:#a10033; --red-soft:#fbe9ee;
  --code:#1d2028; --code-ink:#e8e6e1;
  --radius:14px;
  --serif:"IBM Plex Serif",Georgia,serif;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--red-2)}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.15;margin:0}
h2{font-size:clamp(30px,4vw,42px);letter-spacing:-.01em}
h3{font-size:20px}
p{margin:0}
.eyebrow{font:500 13px/1.4 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--red)}
section{padding:96px 0;border-top:1px solid var(--line)}
.sec-head{display:grid;gap:14px;max-width:720px;margin-bottom:48px}
.sec-head p{color:var(--ink-2);font-size:19px}

/* header */
header{position:sticky;top:0;z-index:20;background:rgba(250,248,244,.9);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:24px;height:68px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font:600 19px var(--serif)}
.brand small{font:500 12px var(--mono);color:var(--ink-3);letter-spacing:.03em}
nav.main{display:flex;gap:4px;margin-left:auto}
nav.main a{color:var(--ink-2);text-decoration:none;font-size:15px;padding:8px 10px;border-radius:8px}
nav.main a:hover{background:var(--paper-2);color:var(--ink)}
.lang{position:relative}
.lang select{appearance:none;font:500 14px var(--sans);color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:999px;padding:8px 34px 8px 36px;cursor:pointer}
.lang svg{position:absolute;top:50%;transform:translateY(-50%);pointer-events:none}
.lang .g{left:12px}.lang .c{right:12px}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 15px var(--sans);text-decoration:none;border-radius:999px;padding:12px 22px;border:1px solid transparent;transition:.15s}
.btn.primary{background:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-2)}
.btn.ghost{border-color:var(--ink);color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.sm{padding:9px 16px;font-size:14px}
@media (max-width:980px){nav.main{display:none}.bar .dl{display:none}.lang{margin-left:auto}}

/* hero */
.hero{padding:80px 0 72px;border-top:0}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
.hero h1{font-size:clamp(40px,6vw,68px);letter-spacing:-.02em;margin:18px 0 22px}
.hero h1 em{font-style:italic;color:var(--red)}
.hero .lead{font-size:20px;color:var(--ink-2);max-width:580px}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:32px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);margin-top:64px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden}
.facts div{padding:22px 24px;border-left:1px solid var(--line)}
.facts div:first-child{border-left:0}
.facts b{display:block;font:600 34px var(--serif);color:var(--ink)}
.facts span{font-size:14px;color:var(--ink-2)}
.net{width:100%;height:auto}
@media (max-width:860px){.hero-grid{grid-template-columns:1fr}.net{max-width:420px}.facts{grid-template-columns:1fr 1fr}.facts div:nth-child(3){border-left:0}.facts div:nth-child(n+3){border-top:1px solid var(--line)}}

/* about */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.about-grid p{font-size:19px;color:var(--ink-2)}
.about-grid p:first-child{font:500 24px/1.45 var(--serif);color:var(--ink)}
@media (max-width:760px){.about-grid{grid-template-columns:1fr;gap:20px}}

/* features */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px}
.card .ic{width:40px;height:40px;border-radius:10px;background:var(--red-soft);color:var(--red);display:grid;place-items:center;margin-bottom:18px}
.card h3{margin-bottom:8px}
.card p{color:var(--ink-2);font-size:16px}
@media (max-width:900px){.cards{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.cards{grid-template-columns:1fr}}

/* roles */
.roles{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:18px}
.role{border:1px solid var(--line);border-radius:var(--radius);padding:24px;background:#fff;display:flex;flex-direction:column;gap:10px}
.role.main{background:var(--ink);color:#fff;border-color:var(--ink)}
.role.main p{color:#c9ccd3}
.role p{color:var(--ink-2);font-size:15.5px}
.tag{align-self:flex-start;font:500 12px var(--mono);text-transform:uppercase;letter-spacing:.05em;padding:4px 9px;border-radius:999px;background:var(--paper-2);color:var(--ink-2)}
.role.main .tag{background:var(--red);color:#fff}
.gosa{margin-top:18px;display:flex;gap:16px;align-items:center;padding:20px 24px;border-radius:var(--radius);background:var(--red-soft);color:var(--ink)}
.gosa b{font-family:var(--mono);color:var(--red-2)}
@media (max-width:900px){.roles{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.roles{grid-template-columns:1fr}}

/* programs */
.progs{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.prog{border-top:3px solid var(--ink);padding-top:18px}
.prog h3{margin-bottom:14px}
.prog ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.prog li{font:500 14px var(--mono);padding:6px 10px;border:1px solid var(--line);background:#fff;border-radius:8px}
@media (max-width:900px){.progs{grid-template-columns:1fr 1fr;row-gap:36px}}
@media (max-width:520px){.progs{grid-template-columns:1fr}}

/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:s}
.step{position:relative;padding:28px 22px 24px;background:#fff;border:1px solid var(--line);border-radius:var(--radius)}
.step::before{counter-increment:s;content:counter(s,decimal-leading-zero);font:500 14px var(--mono);color:var(--red);display:block;margin-bottom:14px}
.step h3{font-size:19px;margin-bottom:8px}
.step p{color:var(--ink-2);font-size:15.5px}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}

/* usb */
.usb{display:grid;gap:14px;max-width:880px}
.u{display:grid;grid-template-columns:44px 1fr;gap:18px;padding:22px 0;border-bottom:1px solid var(--line)}
.u .n{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:500 14px var(--mono)}
.u h3{font-size:19px;margin:5px 0 6px}
.u p{color:var(--ink-2)}
.cmd{margin-top:14px;display:flex;align-items:stretch;background:var(--code);color:var(--code-ink);border-radius:10px;overflow:hidden}
.cmd code{flex:1;font:400 14.5px/1.5 var(--mono);padding:14px 16px;overflow-x:auto;white-space:pre}
.cmd code .p{color:#7f8696;user-select:none}
.cmd button{font:500 13px var(--sans);background:#2a2e38;color:#e8e6e1;border:0;padding:0 16px;cursor:pointer;min-width:84px}
.cmd button:hover{background:#353a46}
.warn{display:flex;gap:14px;padding:18px 20px;background:#fff6e5;border:1px solid #f0d9a8;border-radius:12px;color:#5c4511;margin-bottom:10px}
.mist{margin-top:44px}
.mist h3{margin-bottom:16px}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;font-size:15.5px}
th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--paper-2);font:600 13px var(--sans);text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2)}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:500}
td code{font:400 14px var(--mono);background:var(--paper-2);padding:1px 5px;border-radius:4px}
@media (max-width:700px){table,thead,tbody,tr,th,td{display:block}thead{display:none}tr{border-bottom:1px solid var(--line);padding:10px 0}td{border:0;padding:4px 16px}td:first-child{padding-top:10px}}

/* download */
.dl-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
.arch{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:28px;display:flex;flex-direction:column;gap:14px}
.arch .code{font:500 28px var(--mono)}
.arch p{color:var(--ink-2);font-size:15.5px}
.arch .btn{align-self:flex-start;margin-top:auto}
.req{background:var(--ink);color:#fff;border-radius:var(--radius);padding:28px;display:flex;flex-direction:column;gap:12px}
.req p{color:#c9ccd3;font-size:15.5px}
.req a{color:#ff8fb0}
@media (max-width:860px){.dl-grid{grid-template-columns:1fr}}

/* contribute */
.contrib{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.contrib div{padding:24px;border-radius:var(--radius);background:var(--paper-2)}
.contrib h3{margin-bottom:6px;font-size:19px}
.contrib p{color:var(--ink-2);font-size:15.5px}
@media (max-width:900px){.contrib{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.contrib{grid-template-columns:1fr}}
.links{margin-top:56px;display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--line)}
.links a{display:flex;justify-content:space-between;gap:8px;padding:16px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:15.5px;margin-right:18px}
.links a span{color:var(--ink-3);font:400 13px var(--mono)}
.links a:hover{color:var(--red)}
@media (max-width:900px){.links{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.links{grid-template-columns:1fr}.links a{margin-right:0}}

footer{background:var(--ink);color:#c9ccd3;padding:48px 0;font-size:15px}
footer .wrap{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap}
footer b{color:#fff;font-family:var(--serif);font-size:18px}
footer a{color:#fff}
footer .langs{display:flex;gap:6px;flex-wrap:wrap}
footer .langs a{font:500 13px var(--mono);text-decoration:none;padding:5px 9px;border:1px solid #3a3e48;border-radius:6px;color:#c9ccd3}
footer .langs a.on{background:#fff;color:var(--ink);border-color:#fff}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="#top" data-keep>
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="13" fill="#c8063f"/><path d="M15.5 7.2c-3.9-.4-7.3 2.4-7.6 6.2-.3 3.6 2.4 6.7 5.9 7 2.6.2 4.8-1.4 5.3-3.6.4-1.8-.7-3.6-2.5-3.9-1.5-.3-2.9.7-3.1 2" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
      Skolelinux <small>DEBIAN EDU</small>
    </a>
    <nav class="main" id="nav"></nav>
    <label class="lang">
      <svg class="g" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9.5"/><path d="M2.5 12h19M12 2.5c2.6 2.8 3.9 6 3.9 9.5s-1.3 6.7-3.9 9.5c-2.6-2.8-3.9-6-3.9-9.5s1.3-6.7 3.9-9.5z"/></svg>
      <select id="lang" aria-label="Language"></select>
      <svg class="c" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
    </label>
    <a class="btn primary sm dl" href="#download" data-t="nav.download"></a>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <div class="hero-grid">
        <div>
          <div class="eyebrow" data-t="hero.eyebrow"></div>
          <h1 data-h="hero.title"></h1>
          <p class="lead" data-t="hero.lead"></p>
          <div class="ctas">
            <a class="btn primary" href="#start" data-t="hero.cta1"></a>
            <a class="btn ghost" href="#programs" data-t="hero.cta2"></a>
          </div>
        </div>
        <svg class="net" viewBox="0 0 400 360" role="img" aria-label="">
          <defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d9d3c6"/></pattern></defs>
          <rect width="400" height="360" rx="24" fill="url(#dots)"/>
          <g stroke="#16181d" stroke-width="1.5" stroke-dasharray="4 5" fill="none">
            <path d="M200 180 L80 70"/><path d="M200 180 L320 70"/><path d="M200 180 L60 200"/><path d="M200 180 L340 200"/><path d="M200 180 L110 305"/><path d="M200 180 L290 305"/>
          </g>
          <g>
            <rect x="160" y="130" width="80" height="100" rx="10" fill="#16181d"/>
            <rect x="172" y="146" width="56" height="8" rx="2" fill="#c8063f"/>
            <rect x="172" y="162" width="56" height="8" rx="2" fill="#3a3e48"/>
            <rect x="172" y="178" width="56" height="8" rx="2" fill="#3a3e48"/>
            <circle cx="220" cy="212" r="4" fill="#4ade80"/>
          </g>
          <g fill="#fff" stroke="#16181d" stroke-width="1.5">
            <rect x="52" y="48" width="56" height="40" rx="5"/><rect x="292" y="48" width="56" height="40" rx="5"/>
            <rect x="32" y="182" width="56" height="40" rx="5"/><rect x="312" y="182" width="56" height="40" rx="5"/>
            <rect x="82" y="288" width="56" height="34" rx="5"/><rect x="262" y="288" width="56" height="34" rx="5"/>
          </g>
          <g fill="#c8063f"><circle cx="80" cy="68" r="5"/><circle cx="320" cy="68" r="5"/><circle cx="60" cy="202" r="5"/><circle cx="340" cy="202" r="5"/><circle cx="110" cy="305" r="5"/><circle cx="290" cy="305" r="5"/></g>
        </svg>
      </div>
      <div class="facts" id="facts"></div>
    </div>
  </section>

  <section id="about">
    <div class="wrap">
      <div class="sec-head"><div class="eyebrow" data-t="about.eyebrow"></div><h2 data-t="about.title"></h2></div>
      <div class="about-grid"><p data-t="about.p1"></p><p data-t="about.p2"></p></div>
    </div>
  </section>

  <section id="features" style="padding-top:0;border-top:0">
    <div class="wrap">
      <div class="sec-head"><h2 data-t="features.title"></h2></div>
      <div class="cards" id="cards"></div>
    </div>
  </section>

  <section id="how">
    <div class="wrap">
      <div class="sec-head"><div class="eyebrow" data-t="nav.how"></div><h2 data-t="how.title"></h2><p data-t="how.lead"></p></div>
      <div class="roles" id="roles"></div>
      <div class="gosa">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#a10033" stroke-width="1.8" style="flex:none"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 8h18M8 21h8M12 18v3"/></svg>
        <p data-h="how.gosa"></p>
      </div>
    </div>
  </section>

  <section id="programs">
    <div class="wrap">
      <div class="sec-head"><div class="eyebrow" data-t="nav.programs"></div><h2 data-t="programs.title"></h2><p data-t="programs.lead"></p></div>
      <div class="progs" id="progs"></div>
    </div>
  </section>

  <section id="start">
    <div class="wrap">
      <div class="sec-head"><div class="eyebrow" data-t="nav.start"></div><h2 data-t="start.title"></h2></div>
      <div class="steps" id="steps"></div>
    </div>
  </section>

  <section id="usb">
    <div class="wrap">
      <div class="sec-head"><div class="eyebrow" data-t="nav.usb"></div><h2 data-t="usb.title"></h2><p data-t="usb.lead"></p></div>
      <div class="warn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex:none;margin-top:2px"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17v.5"/></svg>
        <p data-h="usb.warn"></p>
      </div>
      <div class="usb" id="usbsteps"></div>
      <div class="mist">
        <h3 data-t="usb.mistTitle"></h3>
        <table><thead id="mhead"></thead><tbody id="mbody"></tbody></table>
      </div>
    </div>
  </section>

  <section id="download">
    <div class="wrap">
      <div class="sec-head"><div class="eyebrow" data-t="nav.download"></div><h2 data-t="download.title"></h2><p data-t="download.lead"></p></div>
      <div class="dl-grid">
        <div class="arch"><div class="code">amd64</div><p data-t="download.amd64"></p><a class="btn primary" href="https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/" data-t="download.btn"></a></div>
        <div class="arch"><div class="code">arm64</div><p data-t="download.arm64"></p><a class="btn primary" href="https://cdimage.debian.org/debian-cd/current/arm64/iso-cd/" data-t="download.btn"></a></div>
        <div class="req"><h3 data-t="download.reqTitle"></h3><p data-t="download.ram"></p><p data-h="download.more"></p></div>
      </div>
    </div>
  </section>

  <section id="contribute">
    <div class="wrap">
      <div class="sec-head"><div class="eyebrow" data-t="nav.contribute"></div><h2 data-t="contribute.title"></h2><p data-t="contribute.lead"></p></div>
      <div class="contrib" id="contrib"></div>
      <div class="links" id="links"></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <div style="max-width:560px;display:grid;gap:10px">
      <b>Skolelinux · Debian Edu</b>
      <p data-t="footer.about"></p>
      <p data-t="footer.license"></p>
      <p><span data-t="footer.source"></span> <a href="https://www.aamot.io/software/skolelinux/">aamot.io/software/skolelinux</a></p>
    </div>
    <div class="langs" id="footlangs"></div>
  </div>
</footer>

<script>
const LANGS=[
  {id:"en-us",tag:"en-US",name:"English (US)"},
  {id:"nb",tag:"nb-NO",name:"Norsk bokmål"},
  {id:"en-gb",tag:"en-GB",name:"English (UK)"},
  {id:"fr",tag:"fr",name:"Français"},
  {id:"de",tag:"de",name:"Deutsch"},
  {id:"es",tag:"es",name:"Español"}
];

const APPS=[
  ["LibreOffice","Firefox ESR","Thunderbird","Okular"],
  ["GeoGebra","KAlgebra","Kig","Stellarium","Marble","KStars"],
  ["GIMP","Inkscape","Krita","Audacity","Scratch"],
  ["GCompris","Tux Paint","TuxMath","KTurtle","KWordQuiz","Parley"]
];

const CMDS=[
  "sha256sum -c SHA256SUMS --ignore-missing",
  "lsblk -d -o NAME,SIZE,MODEL,TRAN",
  "sudo dd if=debian-13.*-amd64-netinst.iso of=/dev/sdX \\\n  bs=4M status=progress conv=fsync",
  null
];

const LINKS=[
  ["https://wiki.nuug.no/skolelinux","manual","wiki.nuug.no"],
  ["https://wiki.debian.org/DebianEdu/Documentation","docs","wiki.debian.org"],
  ["https://blends.debian.org/edu/","blend","blends.debian.org"],
  ["https://lists.debian.org/debian-edu/","list","lists.debian.org"],
  ["https://wiki.debian.org/DebianEdu","wiki","wiki.debian.org"],
  ["https://salsa.debian.org/debian-edu","source","salsa.debian.org"],
  ["https://www.oftc.net/","irc","#debian-edu"],
  ["https://www.debian.org/","debian","debian.org"]
];

const ICONS=[
  '<path d="M4 6h16v5H4zM4 13h16v5H4z"/><path d="M8 8.5h.01M8 15.5h.01"/>',
  '<path d="M3 10.5 12 4l9 6.5V20H3z"/><path d="M9 20v-6h6v6"/>',
  '<path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6z"/><path d="m9 12 2 2 4-4"/>',
  '<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/>',
  '<path d="M7 8 3 12l4 4M17 8l4 4-4 4M14 4l-4 16"/>'
];

const $=s=>document.querySelector(s);
const get=(o,p)=>p.split(".").reduce((a,k)=>a&&a[k],o);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function render(id){
  const L=LANGS.find(l=>l.id===id)||LANGS[0], t=T[L.id];
  document.documentElement.lang=L.tag;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=get(t,e.dataset.t)||"");
  document.querySelectorAll("[data-h]").forEach(e=>e.innerHTML=get(t,e.dataset.h)||"");
  document.title="Skolelinux · Debian Edu — "+t.nav.about;
  $("#lang").value=L.id;

  $("#nav").innerHTML=["about","how","programs","start","usb","contribute"].map(k=>`<a href="#${k}">${t.nav[k]}</a>`).join("");
  $("#facts").innerHTML=t.facts.map(f=>`<div><b>${f[0]}</b><span>${f[1]}</span></div>`).join("");
  $("#cards").innerHTML=t.features.items.map((f,i)=>`<div class="card"><div class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[i]}</svg></div><h3>${f[0]}</h3><p>${f[1]}</p></div>`).join("");
  $("#roles").innerHTML=t.how.roles.map((r,i)=>`<div class="role${i?"":" main"}"><span class="tag">${i?t.how.optional:t.how.required}</span><h3>${r[0]}</h3><p>${r[1]}</p></div>`).join("");
  $("#progs").innerHTML=t.programs.cats.map((c,i)=>`<div class="prog"><h3>${c}</h3><ul>${APPS[i].map(a=>`<li>${a}</li>`).join("")}</ul></div>`).join("");
  $("#steps").innerHTML=t.start.steps.map(s=>`<div class="step"><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join("");
  $("#usbsteps").innerHTML=t.usb.steps.map((s,i)=>`<div class="u"><div class="n">${i+1}</div><div><h3>${s[0]}</h3><p>${s[1]}</p>${CMDS[i]?`<div class="cmd"><code><span class="p">$ </span>${esc(CMDS[i])}</code><button type="button" data-cmd="${i}">${t.usb.copy}</button></div>`:""}</div></div>`).join("");
  $("#mhead").innerHTML="<tr>"+t.usb.cols.map(c=>`<th>${c}</th>`).join("")+"</tr>";
  $("#mbody").innerHTML=t.usb.mist.map(r=>"<tr>"+r.map(c=>`<td>${c}</td>`).join("")+"</tr>").join("");
  $("#contrib").innerHTML=t.contribute.items.map(c=>`<div><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join("");
  $("#links").innerHTML=LINKS.map(l=>`<a href="${l[0]}">${t.contribute.links[l[1]]}<span>${l[2]}</span></a>`).join("");
  $("#footlangs").innerHTML=LANGS.map(l=>`<a href="#${l.id}" class="${l.id===L.id?"on":""}" lang="${l.tag}">${l.name}</a>`).join("");
  try{localStorage.setItem("skolelinux-lang",L.id)}catch(e){}
  current=L.id;
}
let current="en-us";

$("#lang").innerHTML=LANGS.map(l=>`<option value="${l.id}" lang="${l.tag}">${l.name}</option>`).join("");
$("#lang").addEventListener("change",e=>{location.hash=e.target.value});

function fromHash(){
  const h=location.hash.slice(1);
  if(LANGS.some(l=>l.id===h)){render(h);window.scrollTo({top:0});return true}
  return false;
}
window.addEventListener("hashchange",fromHash);

if(!fromHash()){
  let pick=null;
  try{pick=localStorage.getItem("skolelinux-lang")}catch(e){}
  if(!pick||!T[pick]){
    const n=(navigator.language||"en-US").toLowerCase();
    pick=/^(nb|nn|no)\b/.test(n)?"nb":n.startsWith("fr")?"fr":n.startsWith("de")?"de":n.startsWith("es")?"es":(n.startsWith("en-gb")||n.startsWith("en-ie")||n.startsWith("en-au")||n.startsWith("en-nz"))?"en-gb":"en-us";
  }
  render(pick);
}

document.addEventListener("click",async e=>{
  const b=e.target.closest("button[data-cmd]"); if(!b) return;
  const t=T[current].usb;
  try{await navigator.clipboard.writeText(CMDS[+b.dataset.cmd].replace(/\\\n\s*/g,""));b.textContent=t.copied}
  catch(err){b.textContent="⌘C"}
  setTimeout(()=>b.textContent=t.copy,1600);
});
</script>
